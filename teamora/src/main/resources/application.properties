# ==========================================
# TEAMORA - TEAM TASK MANAGEMENT SYSTEM
# ==========================================
spring.application.name=teamora

# Server Port
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/teamora_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# JWT Configuration
teamora.jwt.secret=TeamoraSuperSecretJwtSigningKeyMustBeAtLeast256BitsLongForHmacSha256Security
teamora.jwt.expiration=86400000

# Error Handling Configuration
server.error.include-message=always
server.error.include-binding-errors=always